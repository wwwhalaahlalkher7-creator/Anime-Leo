name: Deploy Anime Leo Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: anime-leo-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Migrate D1 and Deploy Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare secrets
        working-directory: .
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          }

      - name: Install backend dependencies
        run: npm install

      - name: Show tool versions
        run: |
          node --version
          npm --version
          npx wrangler --version

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply anime-platform-db --remote

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy

      - name: Deployment completed
        working-directory: .
        run: echo "Anime Leo backend deployment completed successfully."
